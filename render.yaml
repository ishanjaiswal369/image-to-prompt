# Render Blueprint — deploys the backend API (free plan). Database lives on Neon (free Postgres).
# Render dashboard → New → Blueprint → pick this repo. It will ask for the `sync: false` values.
services:
  - type: web
    name: image-to-prompt-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Neon connection string (direct, not pooled), e.g. postgresql://user:pass@ep-xxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: VISION_PROVIDER
        value: openrouter
      # Public OAuth client id (same one as extension/manifest.json) — not a secret.
      - key: GOOGLE_CLIENT_ID
        value: 441916701308-3p2g19q7p7bini4t5igelu0eql7a905g.apps.googleusercontent.com
      # Comma-separated chrome-extension:// origins allowed by CORS (local unpacked build first).
      - key: EXTENSION_ORIGIN
        value: chrome-extension://ldfpagaclmmaicecnpdmlbjgnempbapi
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
